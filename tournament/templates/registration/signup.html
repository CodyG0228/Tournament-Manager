
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Tournament Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .signup-card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: min(400px, 85%);
            box-shadow: 0 4px 16px #00000015;
        }
        h1 { margin-top: 0; }
        label { display: block; margin-top: 16px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .errors { color: #b91c1c; }
    </style>
</head>
<body>
    <main class="signup-card">
        <h1>Create your account</h1>
        <p>Join your friends and track your tournaments.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.help_text %}
                    <small>{{ field.help_text }}</small>
                {% endif %}
                <div class="errors">
                    {{ field.errors }}
                </div>
            {% endfor %}

            <button type="submit">Create Account</button>
        </form>

        <p>Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>
    </main>
</body>
</html>
